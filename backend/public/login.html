<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Kaushalya Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --ink: #09090b;
      --ink-2: #3f3f46;
      --muted: #71717a;
      --faint: #a1a1aa;
      --line: #e4e4e7;
      --line-strong: #d4d4d8;
      --accent: #00a0e3;
      --accent-2: #7c5cff;
      --accent-rgb: 0, 160, 227;
      --navy: #0b1020;
      --grad: linear-gradient(135deg, var(--accent), var(--accent-2));
      --danger: #e11d48;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Geist', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
    }
    .mono { font-family: 'Geist Mono', ui-monospace, monospace; }

    /* Left: brand panel */
    .brand {
      position: relative;
      background: var(--navy);
      color: #f1f5f9;
      padding: 40px 48px;
      --mx: 30%; --my: 70%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    /* Grid revealed around the cursor */
    .brand::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(125, 211, 252, 0.13) 1px, transparent 1px),
        linear-gradient(90deg, rgba(125, 211, 252, 0.13) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(360px circle at var(--mx) var(--my), #000 0%, transparent 75%);
      -webkit-mask-image: radial-gradient(360px circle at var(--mx) var(--my), #000 0%, transparent 75%);
    }
    /* Glow that trails the cursor */
    .brand .glow {
      position: absolute; width: 520px; height: 520px; border-radius: 9999px; pointer-events: none;
      left: var(--mx); top: var(--my); transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(0, 160, 227, 0.28), rgba(124, 92, 255, 0.16) 40%, transparent 68%);
      filter: blur(10px);
      transition: left .5s cubic-bezier(.2, .8, .2, 1), top .5s cubic-bezier(.2, .8, .2, 1);
      z-index: 0;
    }
    .brand::after {
      content: '';
      position: absolute;
      width: 560px; height: 560px;
      right: -200px; bottom: -220px;
      background: radial-gradient(circle, rgba(124, 92, 255, 0.4), transparent 65%);
      filter: blur(30px);
      animation: drift 16s ease-in-out infinite;
    }
    @keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-40px, -30px); } }
    @media (prefers-reduced-motion: reduce) { .brand::after { animation: none; } .brand .glow { transition: none; } }
    .brand > * { position: relative; z-index: 1; }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-mark {
      width: 32px; height: 32px; border-radius: 7px;
      background: var(--grad); color: #fff;
      display: grid; place-items: center;
      font-weight: 700; font-size: 11px; letter-spacing: 0.04em;
      box-shadow: 0 8px 22px -8px rgba(0, 160, 227, 0.7);
    }
    .logo-name { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
    .logo-sub { font-size: 11px; color: #8a94a6; }
    .brand h1 {
      font-size: clamp(32px, 3.4vw, 48px);
      line-height: 1.05;
      letter-spacing: -0.035em;
      font-weight: 600;
      max-width: 13ch;
    }
    .brand h1 span {
      background: linear-gradient(120deg, #7dd3fc, #a78bfa 60%, #f0abfc);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .brand-foot { display: flex; gap: 24px; font-size: 11px; color: #6b7690; }
    .brand-foot span { display: inline-flex; align-items: center; gap: 8px; }
    .brand-foot span::before { content: ''; width: 6px; height: 6px; border-radius: 9999px; background: #34d399; box-shadow: 0 0 10px #34d399; }

    /* Right: form */
    .panel {
      display: flex; align-items: center; justify-content: center;
      padding: 40px 24px;
    }
    .card { width: 100%; max-width: 360px; }
    .eyebrow {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--accent); margin-bottom: 12px;
    }
    .card h2 { font-size: 24px; font-weight: 600; letter-spacing: -0.025em; }
    .card p.lead { font-size: 13px; color: var(--muted); margin-top: 6px; }
    form { margin-top: 32px; display: grid; gap: 16px; }
    label { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); margin-bottom: 6px; }
    .field { position: relative; }
    input {
      width: 100%; height: 40px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      background: var(--surface);
      padding: 0 12px;
      font: inherit; font-size: 14px; color: var(--ink);
      transition: border-color .15s, box-shadow .15s;
    }
    input::placeholder { color: var(--faint); }
    input:hover { border-color: rgba(var(--accent-rgb), 0.45); }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(var(--accent-rgb), 0.14); }
    .toggle {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      height: 28px; padding: 0 8px; border: 0; background: transparent;
      font: inherit; font-size: 11px; color: var(--muted); cursor: pointer; border-radius: 4px;
    }
    .toggle:hover { color: var(--accent); background: rgba(var(--accent-rgb), 0.08); }
    button[type=submit] {
      position: relative; overflow: hidden;
      height: 42px; margin-top: 8px;
      border: 0; border-radius: 9px;
      background: var(--grad); color: #fff;
      box-shadow: 0 10px 24px -10px rgba(var(--accent-rgb), 0.75);
      font: inherit; font-size: 14px; font-weight: 500;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: box-shadow .2s, filter .2s, transform .1s;
    }
    button[type=submit]::after {
      content: ''; position: absolute; top: 0; bottom: 0; width: 60%; left: -80%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      transform: skewX(-20deg); transition: left .6s ease;
    }
    button[type=submit]:hover { filter: saturate(1.1) brightness(1.05); box-shadow: 0 14px 30px -10px rgba(var(--accent-rgb), 0.85); }
    button[type=submit]:hover::after { left: 120%; }
    button[type=submit]:active { transform: translateY(1px); }
    button[type=submit]:disabled { opacity: .6; cursor: progress; }
    .arrow { transition: transform .15s; }
    button[type=submit]:hover .arrow { transform: translateX(2px); }
    .error {
      display: none;
      font-size: 12px; color: var(--danger);
      border: 1px solid rgba(225,29,72,0.25); background: rgba(225,29,72,0.05);
      padding: 10px 12px; border-radius: 6px;
    }
    .error.show { display: block; }
    .foot { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
    .foot a { color: var(--accent-ink, #0369a1); text-decoration: none; border-bottom: 1px solid rgba(var(--accent-rgb), 0.35); }
    .foot a:hover { border-bottom-color: var(--accent); }

    @media (max-width: 860px) {
      body { grid-template-columns: 1fr; }
      .brand { display: none; }
      .panel { padding: 32px 16px; }
    }
  </style>
</head>
<body>
  <aside class="brand" id="brand">
    <div class="glow" aria-hidden="true"></div>
    <div class="logo">
      <div class="logo-mark">YSF</div>
      <div>
        <div class="logo-name">Kaushalya LMS</div>
        <div class="logo-sub">Yuvashakti Skill India</div>
      </div>
    </div>
    <h1>Admin console. <span>Training, tracked end to end.</span></h1>
    <div class="brand-foot mono">
      <span>Admin access only</span>
      <span>Secure session</span>
    </div>
  </aside>

  <main class="panel">
    <div class="card">
      <div class="eyebrow mono">Admin access</div>
      <h2>Sign in</h2>
      <p class="lead">Enter your administrator credentials to continue.</p>

      <form id="login-form" autocomplete="on" novalidate>
        <div>
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required autofocus placeholder="admin">
        </div>
        <div>
          <label for="password">Password</label>
          <div class="field">
            <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••" style="padding-right: 56px;">
            <button type="button" class="toggle" id="toggle-pass" aria-label="Show password">Show</button>
          </div>
        </div>
        <div id="error" class="error" role="alert"></div>
        <button type="submit" id="submit-btn">
          <span id="submit-label">Continue</span>
          <span class="arrow" aria-hidden="true">→</span>
        </button>
      </form>

      <div class="foot">
        Trouble signing in? Contact <a href="mailto:lmssupport@ysfskills.com">lmssupport@ysfskills.com</a>
      </div>
    </div>
  </main>

  <script>
    // Cursor spotlight on the brand panel
    const brand = document.getElementById('brand');
    brand.addEventListener('mousemove', (e) => {
      const r = brand.getBoundingClientRect();
      brand.style.setProperty('--mx', `${e.clientX - r.left}px`);
      brand.style.setProperty('--my', `${e.clientY - r.top}px`);
    });

    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error');
    const btn = document.getElementById('submit-btn');
    const label = document.getElementById('submit-label');
    const pass = document.getElementById('password');

    document.getElementById('toggle-pass').addEventListener('click', (e) => {
      const show = pass.type === 'password';
      pass.type = show ? 'text' : 'password';
      e.currentTarget.textContent = show ? 'Hide' : 'Show';
    });

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.add('show');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('show');
      const username = document.getElementById('username').value.trim();
      const password = pass.value;
      if (!username || !password) return showError('Enter both username and password.');

      btn.disabled = true;
      label.textContent = 'Signing in…';
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password })
        });
        const json = await res.json().catch(() => ({}));
        if (res.ok && json.success) {
          window.location.replace('/admin');
          return;
        }
        showError(json.message || 'Sign in failed. Please try again.');
      } catch (err) {
        showError('Unable to reach the server. Check your connection.');
      }
      btn.disabled = false;
      label.textContent = 'Continue';
    });
  </script>
</body>
</html>
